<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shady & Youssra – Our Days</title>

  <!-- Google Fonts: Amatic SC (ALL typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       CSS VARIABLES – edit palette here
    ============================================================ */
    :root {
      --orange:       #D97A4A;
      --terracotta:   #C96B4B;
      --cream:        #F4E6D1;
      --sand:         #E7D2B3;
      --gold:         #D8B68A;
      --brown:        #8A5A44;
      --floral:       #FFF7EE;
      --peach:        #EBC1A3;
      --border-red:   #D85C42;
      --shadow-brown: #6F4A3A;

      --glow:         rgba(217,122,74,0.30);
      --particle:     rgba(235,193,163,0.50);
      --overlay-bg:   rgba(255,247,238,0.18);
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Amatic SC', cursive;
      background: var(--cream);
      color: var(--shadow-brown);
      overflow-x: hidden;
    }

    /* ============================================================
       LOADING SCREEN
    ============================================================ */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: var(--cream);

      /* Warm watercolor paper texture via radial gradients */
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(235,193,163,0.45) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(217,122,74,0.20) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(244,230,209,0.90) 0%, transparent 80%);

      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Canvas for floating particles on loading screen */
    #loading-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #loading-logo {
      width: min(260px, 65vw);   /* ← LOGO SIZE – change the first value (px) to resize */
      animation: breathe 3s ease-in-out infinite;
      filter: drop-shadow(0 0 18px var(--glow));
      position: relative;
      z-index: 1;
    }

    @keyframes breathe {
      0%,100% { transform: scale(1)   translateY(0);    opacity: 1;    }
      50%      { transform: scale(1.06) translateY(-6px); opacity: 0.88; }
    }

    #loading-text {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 700;
      color: var(--brown);
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    #loading-pets {
      display: flex;
      gap: 12px;
      font-size: clamp(26px, 6vw, 40px);
      position: relative;
      z-index: 1;
    }

    #loading-pets span {
      display: inline-block;
      animation: petBounce 1.4s ease-in-out infinite;
    }
    #loading-pets span:nth-child(1) { animation-delay: 0s;    }
    #loading-pets span:nth-child(2) { animation-delay: 0.23s; }
    #loading-pets span:nth-child(3) { animation-delay: 0.46s; }
    #loading-pets span:nth-child(4) { animation-delay: 0.69s; }
    #loading-pets span:nth-child(5) { animation-delay: 0.92s; }
    #loading-pets span:nth-child(6) { animation-delay: 1.15s; }

    @keyframes petBounce {
      0%,100% { transform: translateY(0)   scale(1);    opacity: 0.7; }
      50%      { transform: translateY(-10px) scale(1.15); opacity: 1;   }
    }

    /* ============================================================
       MAIN WRAPPER
    ============================================================ */
    #main-wrapper {
      opacity: 0;
      transition: opacity 1s ease;
    }
    #main-wrapper.visible { opacity: 1; }

    /* ============================================================
       INVITATION CONTAINER
       Centered, max-width column, responsive
    ============================================================ */
    #invitation-container {
      position: relative;
      max-width: 540px;
      margin: 0 auto;
      /* Cinematic entrance */
      animation: invEnter 1.2s cubic-bezier(.22,.68,0,1.2) both;
      animation-play-state: paused;
    }
    #invitation-container.animate { animation-play-state: running; }

    @keyframes invEnter {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    /* The primary invitation image – never replaced, never altered */
    #invitation-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    /* ============================================================
       GIF OVERLAY
    ============================================================ */

    /* ============================================================
       GIF OVERLAY POSITION CONTROLS START
       ↓↓↓  THIS IS WHERE YOU POSITION THE GIF  ↓↓↓
       Edit ONLY the values marked with  ← EDIT THIS
    ============================================================ */
    #gif-overlay {
      position: absolute;

      /* ─── VERTICAL POSITION ──────────────────────────────────
         Distance from the TOP of the invitation image.
         Use % (relative to invitation height) or px.
         Example:  top: 5%   or   top: 60px                     */
      top: 42.6%;              /* ← EDIT THIS – move GIF up/down   */

      /* ─── HORIZONTAL POSITION ───────────────────────────────
         Distance from the LEFT edge of the invitation image.
         Use % (relative to invitation width) or px.
         Example:  left: 10%   or   left: 30px                  */
      left: 15%;             /* ← EDIT THIS – move GIF left/right */

      /* ─── SIZE ───────────────────────────────────────────────
         "auto" = GIF displays at its original pixel size (default).
         Change to px or % only if you want to scale it.
         Example:  width: 200px   or   width: 40%               */
      width: 500px;          /* ← EDIT THIS – "auto" keeps original size */

      /* Fixed internals – do not change these */
      pointer-events: none;
      height: auto;
    }

    #gif-overlay img {
      width: 80%;
      height: 80%;
      display: block;

      /* ─── OPACITY ────────────────────────────────────────────
         0 = invisible, 1 = fully visible                        */
      opacity: 1;           /* ← EDIT THIS – adjust transparency */

      /* ─── BLEND MODE ─────────────────────────────────────────
         Options: normal | screen | multiply | overlay | soft-light
         Use "normal" to show the gif exactly as-is (transparent bg)
         Use "screen"  to let light areas shine through           */
      mix-blend-mode: normal; /* ← EDIT THIS – change blend mode  */
    }
    /* GIF OVERLAY POSITION CONTROLS END
    ============================================================ */

    /* ============================================================
       INTERACTIVE OVERLAY (transparent layer above image)
    ============================================================ */
    #interactive-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none; /* children opt-in individually */
    }

    /* ============================================================
       GOOGLE MAP BUTTON
    ============================================================ */

    /* MAP BUTTON POSITION START */
    /* Adjust top / left / width / height here */
    #map-btn-wrapper {
      position: absolute;
      top: 58.5%;       /* ← vertical % of invitation height  */
      left: 50%;
      transform: translateX(-50%);
      width: 55%;       /* ← button width                     */
      pointer-events: all;
    }
    /* MAP BUTTON POSITION END */

    #map-btn {
      display: block;
      width: 100%;
      padding: 7px 0;
      font-family: 'Amatic SC', cursive;
      font-size: clamp(15px, 3.5vw, 20px);
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--shadow-brown);
      background: rgba(244,230,209,0.22);
      border: 1.5px solid var(--terracotta);
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background 0.3s, box-shadow 0.3s, transform 0.2s;
      backdrop-filter: blur(2px);
    }
    #map-btn:hover {
      background: rgba(201,107,75,0.22);
      box-shadow: 0 0 18px var(--glow);
      transform: scale(1.04);
    }

    /* ============================================================
       RSVP SECTION
    ============================================================ */

    /* RSVP POSITION START */
    /* Adjust top / left / width / padding here */
    #rsvp-wrapper {
      position: absolute;
      top: 66.5%;       /* ← vertical % of invitation height */
      left: 50%;
      transform: translateX(-50%);
      width: 65%;       /* ← section width – decrease/increase % here */
      pointer-events: all;
    }
    /* RSVP POSITION END */

    /* ── RSVP field spacing: −8% height via tighter margins/padding ── */
    .rsvp-field {
      margin-bottom: clamp(3px, 0.8vmin, 5px);   /* was 6px */
    }

    .rsvp-label {
      display: block;
      /* font slightly larger (+1–2px) and vmin-aware for aspect ratio */
      font-size: clamp(13px, 3vmin, 17px);        /* was clamp(12px,2.8vw,16px) */
      font-weight: 700;
      color: var(--shadow-brown);
      letter-spacing: 1px;
      margin-bottom: clamp(1px, 0.4vmin, 2px);   /* was 2px */
      text-transform: uppercase;
    }

    .rsvp-input {
      width: 100%;
      padding: clamp(3px, 0.8vmin, 4px) clamp(6px, 1.5vmin, 9px); /* was 5px 10px */
      font-family: 'Amatic SC', cursive;
      font-size: clamp(15px, 3.5vmin, 19px);      /* was clamp(14px,3.2vw,18px) */
      color: var(--shadow-brown);
      background: var(--overlay-bg);
      border: 1.5px solid var(--orange);
      border-radius: 6px;
      outline: none;
      transition: box-shadow 0.3s, border-color 0.3s, background 0.3s;
      backdrop-filter: blur(3px);
    }

    .rsvp-input:focus {
      border-color: var(--terracotta);
      box-shadow: 0 0 12px rgba(217,122,74,0.35);
      background: rgba(255,247,238,0.35);
    }

    /* Attendance buttons row */
    #attendance-row {
      display: flex;
      gap: clamp(4px, 1vmin, 6px);               /* was 6px */
      margin-top: clamp(1px, 0.3vmin, 2px);      /* was 2px */
    }

    .attend-btn {
      flex: 1;
      padding: clamp(3px, 0.8vmin, 4px) clamp(2px, 0.5vmin, 4px); /* was 5px 4px */
      font-family: 'Amatic SC', cursive;
      font-size: clamp(14px, 3vmin, 18px);        /* was clamp(13px,2.8vw,17px) */
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--shadow-brown);
      background: rgba(255,247,238,0.25);
      border: 1.5px solid var(--orange);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s, color 0.3s;
      text-transform: uppercase;
      backdrop-filter: blur(2px);
    }

    .attend-btn:hover,
    .attend-btn.selected {
      background: var(--orange);
      color: var(--floral);
      box-shadow: 0 0 14px var(--glow);
    }

    /* Confirm button */
    #rsvp-confirm-btn {
      display: block;
      width: 100%;
      margin-top: clamp(3px, 0.9vmin, 5px);      /* was 6px */
      padding: clamp(4px, 1vmin, 5px) 0;          /* was 6px 0 */
      font-family: 'Amatic SC', cursive;
      font-size: clamp(15px, 3.8vmin, 21px);      /* was clamp(14px,3.5vw,20px) */
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--floral);
      background: linear-gradient(135deg, var(--orange), var(--terracotta));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s, filter 0.3s;
      box-shadow: 0 3px 14px rgba(217,122,74,0.40);
    }

    #rsvp-confirm-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 22px rgba(217,122,74,0.55);
      filter: brightness(1.08);
    }

    /* Success message */
    #rsvp-success {
      display: none;
      text-align: center;
      font-size: clamp(17px, 4.2vmin, 23px);      /* was clamp(16px,4vw,22px) */
      font-weight: 700;
      color: var(--shadow-brown);
      background: rgba(255,247,238,0.6);
      border-radius: 10px;
      padding: clamp(6px, 1.5vmin, 9px);          /* was 10px */
      margin-top: clamp(3px, 0.8vmin, 5px);       /* was 6px */
      backdrop-filter: blur(4px);
      border: 1px solid var(--gold);
    }

    /* ── Aspect-ratio breakpoints for very small / narrow phones ── */

    /* Tall & narrow phones (e.g. iPhone SE, Galaxy A series) */
    @media (max-width: 400px) {
      #rsvp-wrapper { width: 70%; }
      .rsvp-label   { font-size: clamp(12px, 3.5vw, 15px); }
      .rsvp-input   { font-size: clamp(13px, 3.8vw, 16px); padding: 3px 7px; }
      .attend-btn   { font-size: clamp(12px, 3.2vw, 15px); padding: 3px 2px; }
      #rsvp-confirm-btn { font-size: clamp(13px, 4vw, 17px); padding: 4px 0; }
      #rsvp-success     { font-size: clamp(14px, 4vw, 17px); padding: 5px; }
    }

    /* Very short viewport height (landscape or compact phones < 680px tall) */
    @media (max-height: 680px) {
      .rsvp-field        { margin-bottom: 2px; }
      .rsvp-label        { font-size: clamp(11px, 2.5vh, 14px); margin-bottom: 1px; }
      .rsvp-input        { padding: 2px 7px; font-size: clamp(12px, 2.8vh, 15px); }
      #attendance-row    { gap: 4px; margin-top: 1px; }
      .attend-btn        { padding: 2px 3px; font-size: clamp(11px, 2.5vh, 14px); }
      #rsvp-confirm-btn  { padding: 3px 0; margin-top: 3px; font-size: clamp(12px, 3vh, 16px); }
      #rsvp-success      { padding: 4px; margin-top: 3px; font-size: clamp(12px, 3vh, 15px); }
    }

    /* Ultra-small screens (e.g. 320px wide, iPhone 5) */
    @media (max-width: 340px) {
      #rsvp-wrapper { width: 72%; }
      .rsvp-label   { font-size: 11px; letter-spacing: 0.5px; }
      .rsvp-input   { font-size: 12px; padding: 2px 5px; }
      .attend-btn   { font-size: 11px; padding: 2px; letter-spacing: 0.5px; }
      #rsvp-confirm-btn { font-size: 12px; padding: 3px 0; letter-spacing: 1px; }
    }

    /* ============================================================
       MUSIC BUTTON (fixed bottom-right)
    ============================================================ */
    #music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 500;
      padding: 10px 18px;
      font-family: 'Amatic SC', cursive;
      font-size: clamp(15px, 3.5vw, 19px);
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--floral);
      background: var(--orange);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(217,122,74,0.50);
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #music-btn:hover {
      background: var(--terracotta);
      transform: scale(1.07);
      box-shadow: 0 6px 26px rgba(201,107,75,0.55);
    }
    #music-btn .music-icon { font-size: 1.2em; }

    /* ============================================================
       FLOATING PARTICLES CANVAS (background)
    ============================================================ */
    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 560px) {
      #invitation-container { max-width: 100vw; }
    }

  </style>
</head>
<body>

<!-- ============================================================
     LOADING SCREEN
============================================================ -->
<div id="loading-screen" role="status" aria-label="Loading wedding invitation">
  <canvas id="loading-canvas"></canvas>

  <!-- Logo (upload logo1.png in same folder) -->
  <img id="loading-logo" src="logo1.png" alt="Shady & Youssra Logo" />

  <div id="loading-text">Loading our special day&nbsp;✦</div>

  <!-- Pet emoji animation instead of dots -->
  <div id="loading-pets" aria-hidden="true">
    <span>🦮</span>
    <span>🐈</span>
    <span>🦮</span>
    <span>🐈</span>
    <span>🦮</span>
    <span>🐈</span>
  </div>
</div>

<!-- ============================================================
     MAIN INVITATION WRAPPER
============================================================ -->
<div id="main-wrapper">

  <!-- Background floating particles -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <!-- Hidden audio element – music1.mp3 must be in same folder -->
  <audio id="bg-music" src="music1.mp3" loop preload="auto"></audio>

  <!-- Music toggle button (fixed) -->
  <button id="music-btn" aria-label="Toggle background music">
    <span class="music-icon">♪</span>
    <span id="music-label">Tap for music</span>
  </button>

  <!-- ====================================================
       INVITATION CONTAINER
  ==================================================== -->
  <div id="invitation-container">

    <!-- PRIMARY INVITATION IMAGE (never altered, never removed) -->
    <img id="invitation-image"
         src="image1.png"
         alt="Shady & Youssra Wedding Invitation"
         draggable="false" />

    <!-- ==================================================
         GIF OVERLAY POSITION CONTROLS START
         Adjust top / left / width / opacity / blend-mode
         in the CSS above (#gif-overlay)
    ================================================== -->
    <div id="gif-overlay" aria-hidden="true">
      <!-- Replace gif1.gif positioning in CSS above -->
      <img src="gif1.gif" alt="" />
    </div>
    <!-- GIF OVERLAY POSITION CONTROLS END -->

    <!-- ==================================================
         TRANSPARENT INTERACTIVE OVERLAY
    ================================================== -->
    <div id="interactive-overlay" aria-hidden="false">

      <!-- MAP BUTTON POSITION START -->
      <!-- Adjust top / left / width inside #map-btn-wrapper in CSS -->
      <div id="map-btn-wrapper">
        <a id="map-btn"
           href="https://www.google.com/maps/search/La+Cabana+Blue+Blue"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Open venue on Google Maps">
          📍 Open in Google Maps
        </a>
      </div>
      <!-- MAP BUTTON POSITION END -->

      <!-- RSVP POSITION START -->
      <!-- Adjust top / left / width inside #rsvp-wrapper in CSS -->
      <div id="rsvp-wrapper" role="form" aria-label="RSVP Form">

        <!-- Name field -->
        <div class="rsvp-field">
          <label class="rsvp-label" for="rsvp-name">Your Name</label>
          <input class="rsvp-input"
                 id="rsvp-name"
                 type="text"
                 placeholder="Enter your name…"
                 autocomplete="name" />
        </div>

        <!-- Attendance -->
        <div class="rsvp-field">
          <span class="rsvp-label">Will you join us?</span>
          <div id="attendance-row">
            <button class="attend-btn" data-value="joyfully"   id="btn-joyfully">Joyfully</button>
            <button class="attend-btn" data-value="regretfully" id="btn-regretfully">Regretfully</button>
          </div>
        </div>

        <!-- Guest count -->
        <div class="rsvp-field">
          <label class="rsvp-label" for="rsvp-guests">Guests</label>
          <input class="rsvp-input"
                 id="rsvp-guests"
                 type="number"
                 min="1" max="10"
                 placeholder="Number of guests…" />
        </div>

        <!-- Confirm button -->
        <button id="rsvp-confirm-btn" type="button">✦ Confirm ✦</button>

        <!-- Success message -->
        <div id="rsvp-success" role="alert" aria-live="polite">
          🎊 We can't wait to celebrate with you! 🎊
        </div>

      </div>
      <!-- RSVP POSITION END -->

    </div><!-- /interactive-overlay -->

  </div><!-- /invitation-container -->

</div><!-- /main-wrapper -->


<script>
/* ============================================================
   ASSET PRELOADING
   Wait for image1.png, gif1.gif, and fonts before hiding loader
============================================================ */
(function () {

  const ASSETS = ['image1.png', 'gif1.gif', 'logo1.png'];
  let loaded = 0;
  let fontsReady = false;
  let assetsReady = false;

  function tryReveal () {
    if (fontsReady && assetsReady) revealInvitation();
  }

  /* --- Preload images ---------------------------------------- */
  ASSETS.forEach(src => {
    const img = new Image();
    img.onload  = img.onerror = () => { if (++loaded >= ASSETS.length) { assetsReady = true; tryReveal(); } };
    img.src = src;
  });

  /* --- Fonts -------------------------------------------------- */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { fontsReady = true; tryReveal(); });
  } else {
    setTimeout(() => { fontsReady = true; tryReveal(); }, 800);
  }

  /* --- Fallback: reveal after 5 s no matter what -------------- */
  setTimeout(revealInvitation, 5000);

  function revealInvitation () {
    revealInvitation = () => {}; // run once
    const loader  = document.getElementById('loading-screen');
    const wrapper = document.getElementById('main-wrapper');
    const container = document.getElementById('invitation-container');

    loader.classList.add('hidden');
    wrapper.classList.add('visible');
    setTimeout(() => container.classList.add('animate'), 100);

    initParticles();
    initMusic();
  }

})();

/* ============================================================
   LOADING SCREEN PARTICLES
============================================================ */
(function () {
  const canvas = document.getElementById('loading-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, pts = [];

  function resize () {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 55; i++) {
    pts.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 4 + 1.5,
      dx: (Math.random() - 0.5) * 0.4,
      dy: (Math.random() - 0.5) * 0.4,
      alpha: Math.random() * 0.5 + 0.1,
    });
  }

  (function loop () {
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(235,193,163,${p.alpha})`;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > W) p.dx *= -1;
      if (p.y < 0 || p.y > H) p.dy *= -1;
    });
    requestAnimationFrame(loop);
  })();
})();

/* ============================================================
   BACKGROUND PARTICLES (main page)
============================================================ */
function initParticles () {
  const canvas = document.getElementById('particles-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, pts = [];

  function resize () {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 70; i++) {
    pts.push({
      x:     Math.random() * window.innerWidth,
      y:     Math.random() * window.innerHeight,
      r:     Math.random() * 3 + 1,
      dx:    (Math.random() - 0.5) * 0.35,
      dy:    -(Math.random() * 0.5 + 0.2), // drift upward gently
      alpha: Math.random() * 0.35 + 0.08,
      pulse: Math.random() * Math.PI * 2,
    });
  }

  (function loop (t) {
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      p.pulse += 0.018;
      const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(235,193,163,${a})`;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < -10) p.y = H + 10;
    });
    requestAnimationFrame(loop);
  })();
}

/* ============================================================
   MUSIC PLAYER
============================================================ */
function initMusic () {
  const audio  = document.getElementById('bg-music');
  const btn    = document.getElementById('music-btn');
  const label  = document.getElementById('music-label');
  let playing  = false;

  audio.volume = 0;

  /* Attempt autoplay */
  const autoplayPromise = audio.play();
  if (autoplayPromise !== undefined) {
    autoplayPromise
      .then(() => {
        playing = true;
        fadeVolume(audio, 0, 0.45, 3000); // fade in over 3 s
        label.textContent = '♫ Playing';
      })
      .catch(() => {
        /* Autoplay blocked – show tap-to-enable CTA */
        label.textContent = 'Tap for music';
      });
  }

  btn.addEventListener('click', () => {
    if (playing) {
      audio.pause();
      playing = false;
      label.textContent = 'Tap for music';
      btn.style.background = 'var(--terracotta)';
    } else {
      audio.play().then(() => {
        playing = true;
        fadeVolume(audio, audio.volume, 0.45, 1500);
        label.textContent = '♫ Playing';
        btn.style.background = 'var(--orange)';
      }).catch(() => {});
    }
  });
}

/* Smooth volume fade helper */
function fadeVolume (audioEl, from, to, duration) {
  const steps = 60;
  const stepTime = duration / steps;
  let step = 0;
  audioEl.volume = from;
  const timer = setInterval(() => {
    step++;
    audioEl.volume = Math.min(1, from + (to - from) * (step / steps));
    if (step >= steps) clearInterval(timer);
  }, stepTime);
}

/* ============================================================
   RSVP INTERACTIONS
============================================================ */
(function () {
  let selectedAttendance = '';

  const joyBtn  = document.getElementById('btn-joyfully');
  const regBtn  = document.getElementById('btn-regretfully');
  const confirm = document.getElementById('rsvp-confirm-btn');
  const success = document.getElementById('rsvp-success');

  function selectAttend (val) {
    selectedAttendance = val;
    joyBtn.classList.toggle('selected', val === 'joyfully');
    regBtn.classList.toggle('selected', val === 'regretfully');
  }

  joyBtn.addEventListener('click', () => selectAttend('joyfully'));
  regBtn.addEventListener('click', () => selectAttend('regretfully'));

  confirm.addEventListener('click', () => {
    const name   = document.getElementById('rsvp-name').value.trim();
    const guests = document.getElementById('rsvp-guests').value;

    if (!name) {
      document.getElementById('rsvp-name').focus();
      document.getElementById('rsvp-name').style.borderColor = 'var(--border-red)';
      setTimeout(() => document.getElementById('rsvp-name').style.borderColor = '', 1500);
      return;
    }
    if (!selectedAttendance) {
      joyBtn.style.boxShadow = '0 0 12px var(--border-red)';
      setTimeout(() => { joyBtn.style.boxShadow = ''; }, 1500);
      return;
    }

    /* --- BACKEND INTEGRATION COMMENT ---
       Replace this block with your preferred backend:

       OPTION A – Google Apps Script webhook:
         fetch('YOUR_APPS_SCRIPT_URL', {
           method: 'POST',
           body: JSON.stringify({ name, attendance: selectedAttendance, guests })
         });

       OPTION B – Firebase Realtime Database:
         import { getDatabase, ref, push } from "firebase/database";
         push(ref(db, 'rsvps'), { name, attendance: selectedAttendance, guests });

       OPTION C – Generic webhook (Make, Zapier, n8n, etc.):
         fetch('YOUR_WEBHOOK_URL', { method:'POST', headers:{'Content-Type':'application/json'},
           body: JSON.stringify({ name, attendance: selectedAttendance, guests, timestamp: new Date() })
         });

       OPTION D – Google Sheets via Apps Script:
         Same as Option A; log to sheet in the script.
    --------------------------------------------------- */

    console.log('RSVP submitted:', { name, attendance: selectedAttendance, guests });

    /* Show success */
    confirm.style.display = 'none';
    success.style.display  = 'block';
    success.style.animation = 'none';
    success.style.opacity   = '0';
    requestAnimationFrame(() => {
      success.style.transition = 'opacity 0.6s ease';
      success.style.opacity    = '1';
    });
  });

})();
